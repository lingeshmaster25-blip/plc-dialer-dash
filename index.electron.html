<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLC Dialer Dash</title>
    <!-- CSP intentionally omitted: the packaged app loads from file://,
         we control every script, and CSP under file:// blocks Vite's
         module chunks in some Electron versions. -->
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Surface any uncaught renderer error in the main-process log
      // (visible via DevTools console + ../logs/main.log).
      window.addEventListener("error", (e) => {
        console.error("[window.error]", e.message, e.error && e.error.stack);
      });
      window.addEventListener("unhandledrejection", (e) => {
        console.error("[unhandledrejection]", e.reason && e.reason.stack || e.reason);
      });
    </script>
    <script type="module" src="/src/main-spa.tsx"></script>
  </body>
</html>
