<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLC Dialer Dash</title>
    <!--
      CSP for the packaged app.
      Loaded over file:// so 'self' is the file scheme.
      Allows inline styles (Tailwind injection), eval-less workers,
      and fetch to the local backend at :4000.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' 'unsafe-inline' data: blob: file:;
        script-src  'self' 'unsafe-inline' file:;
        style-src   'self' 'unsafe-inline' file:;
        connect-src 'self' http://localhost:4000 http://127.0.0.1:4000 ws://localhost:5173 file:;
        img-src     'self' data: blob: file:;
        worker-src  'self' blob:;
      "
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-spa.tsx"></script>
  </body>
</html>
