<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLC Dialer Dash</title>
    <!-- CSP intentionally omitted: the packaged app loads from file://,
         we control every script, and CSP under file:// blocks Vite's
         module chunks in some Electron versions. -->
  </head>
  <body style="background:#0f1117;color:#e5e7eb;font-family:system-ui,sans-serif;margin:0">
    <div id="root">
      <div id="boot-banner" style="padding:2rem;font-size:14px">
        <div style="font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.7">PLC Dialer Dash</div>
        <div style="margin-top:.5rem;opacity:.6">Booting renderer…</div>
        <pre id="boot-error" style="margin-top:1rem;color:#f87171;white-space:pre-wrap"></pre>
      </div>
    </div>
    <script>
      // Surface any uncaught renderer error both in the DOM and in the log.
      function showBootError(label, err) {
        var el = document.getElementById("boot-error");
        if (el) el.textContent += "\n[" + label + "] " + (err && (err.stack || err.message || err) || err);
        console.error("[" + label + "]", err);
      }
      window.addEventListener("error", (e) => showBootError("window.error", e.error || e.message));
      window.addEventListener("unhandledrejection", (e) => showBootError("unhandledrejection", e.reason));
    </script>
    <script type="module" src="/src/main-spa.tsx"></script>
  </body>
</html>
