name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "electron/**"
      - "src/**"
      - "server/**"
      - "vite.config.electron.ts"
      - "index.electron.html"
      - "electron-builder.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (root)
        run: npm install

      - name: Install server dependencies (production only)
        run: npm install --omit=dev
        working-directory: server

      - name: Verify server node_modules
        shell: pwsh
        run: |
          if (-Not (Test-Path "server\node_modules\express")) { throw "server/node_modules/express MISSING" }
          if (-Not (Test-Path "server\node_modules\cors"))    { throw "server/node_modules/cors MISSING" }
          if (-Not (Test-Path "server\node_modules\node-snap7")) { throw "server/node_modules/node-snap7 MISSING" }
          Write-Host "OK - server deps present:"
          Get-ChildItem server\node_modules -Directory | Select-Object -First 30 -ExpandProperty Name

      - name: Rebuild node-snap7 for Electron
        # Run from project root so Electron headers (root node_modules) are
        # found, and target the server/ module dir where node-snap7 lives.
        run: npx --yes @electron/rebuild -f -w node-snap7 --module-dir server
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: "true"

      - name: Build Windows installer
        run: npm run electron:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-electron/*.exe
          retention-days: 30
