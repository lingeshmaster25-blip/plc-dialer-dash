name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "electron/**"
      - "src/**"
      - "vite.config.electron.ts"
      - "index.electron.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (root)
        run: npm install

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Install @electron/rebuild
        run: npm install --no-save @electron/rebuild

      - name: Rebuild node-snap7 for Electron
        # Run from project root so Electron headers (root node_modules) are found,
        # and target the server/ module dir where node-snap7 actually lives.
        run: npx --yes @electron/rebuild -f -w node-snap7 --module-dir server
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64

      - name: Build Windows installer
        run: npm run electron:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-electron/*.exe
          retention-days: 30
