name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "electron/**"
      - "src/**"
      - "server/**"
      - "vite.config.electron.ts"
      - "index.electron.html"
      - "electron-builder.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # node-gyp v9 (used by node-snap7) imports `distutils`, which was
      # removed from Python's stdlib in 3.12. Pin Python 3.11 so the
      # native rebuild step doesn't fail with ModuleNotFoundError.
      - name: Setup Python 3.11 (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (root)
        run: npm install

      - name: Install server dependencies (production only)
        run: npm install --omit=dev
        working-directory: server

      - name: Verify server node_modules
        shell: pwsh
        run: |
          if (-Not (Test-Path "server\node_modules\express")) { throw "server/node_modules/express MISSING" }
          if (-Not (Test-Path "server\node_modules\cors"))    { throw "server/node_modules/cors MISSING" }
          if (-Not (Test-Path "server\node_modules\node-snap7")) { throw "server/node_modules/node-snap7 MISSING" }
          Write-Host "OK - server deps present:"
          Get-ChildItem server\node_modules -Directory | Select-Object -First 30 -ExpandProperty Name

      # Download a real Node.js binary to ship inside the installer.
      # node-snap7's old C++ binding FATAL-crashes inside Electron's
      # Node mode because Electron 27 has V8's sandbox compiled in.
      # A plain Node binary doesn't, so we run the backend with that.
      # The npm install above compiled node-snap7 against Node 20's ABI,
      # so the binding matches this exact runtime — no electron-rebuild
      # needed.
      - name: Download bundled Node.js runtime
        shell: pwsh
        run: |
          $version = "20.18.0"
          $url = "https://nodejs.org/dist/v$version/node-v$version-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile "node.zip"
          Expand-Archive -Path "node.zip" -DestinationPath "tmp-node" -Force
          New-Item -ItemType Directory -Force -Path "bundled-node" | Out-Null
          Copy-Item "tmp-node\node-v$version-win-x64\node.exe" "bundled-node\node.exe"
          Remove-Item -Recurse -Force "tmp-node","node.zip"
          Write-Host "Bundled Node:"
          & "bundled-node\node.exe" --version

      - name: Build Windows installer
        run: npm run electron:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify built installer contains server deps + node.exe
        shell: pwsh
        run: |
          $u = "dist-electron\win-unpacked\resources\server\node_modules"
          if (-Not (Test-Path "$u\express"))   { throw "PACKED: $u\express missing" }
          if (-Not (Test-Path "$u\cors"))      { throw "PACKED: $u\cors missing" }
          if (-Not (Test-Path "$u\node-snap7")){ throw "PACKED: $u\node-snap7 missing" }
          $node = "dist-electron\win-unpacked\resources\bundled-node\node.exe"
          if (-Not (Test-Path $node))          { throw "PACKED: $node missing" }
          Write-Host "OK - packed server deps:"
          Get-ChildItem $u -Directory | Select-Object -First 30 -ExpandProperty Name
          Write-Host "OK - bundled node:"
          & $node --version

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist-electron/*.exe
          retention-days: 30
